apiVersion: apps/v1
kind: Deployment
metadata:
  name: delhi-aqi-streamlit
  labels:
    app: delhi-aqi
    component: streamlit
spec:
  replicas: 2
  selector:
    matchLabels:
      app: delhi-aqi
      component: streamlit
  template:
    metadata:
      labels:
        app: delhi-aqi
        component: streamlit
    spec:
      containers:
        - name: streamlit
          image: ghcr.io/YOUR_ORG/delhi-aqi-predictor:latest
          ports:
            - containerPort: 8501
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 60
            periodSeconds: 20
